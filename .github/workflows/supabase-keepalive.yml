name: Supabase keep-alive

# مشروع Supabase المجاني يتوقف تلقائياً بعد 7 أيام بلا نشاط (لوحة التحكم وبوابة المندوبين تقف).
# طلب خفيف للقاعدة مرتين في اليوم يبقيه شغّال. لو فشل الطلب (المشروع موقوف)، الـ workflow يفشل
# وGitHub يبعتلك إيميل — يعني تنبيه مبكر باش ترجّع المشروع من لوحة Supabase.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

# actions: write — باش الخطوة الأخيرة تعيد تفعيل الـ workflow نفسه
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database (public_stats)
        env:
          SUPABASE_URL: https://ubyzdzbubmffdxtygoah.supabase.co
          # المفتاح العام (publishable) — موجود أصلاً في كود الموقع، والصلاحيات كلها في RLS
          SUPABASE_KEY: sb_publishable_XODVoT4TIhnx4XAiqy6Aqg_p2JPId7r
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' --retry 3 --retry-delay 15 --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/public_stats" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') || true
          echo "HTTP ${code:-000}"
          head -c 300 out.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::قاعدة البيانات ما ردّتش — غالباً المشروع موقوف. رجّعه من https://supabase.com/dashboard/project/ubyzdzbubmffdxtygoah"
            exit 1
          fi

      # GitHub يوقف الـ workflows المجدولة في المستودعات العامة بعد 60 يوم بلا نشاط في المستودع.
      # إعادة التفعيل عبر الـ API في كل تشغيل تخلّي المؤقت يبدا من جديد، فالـ ping ما يوقفش أبداً.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" && echo "workflow re-enabled" || echo "::warning::تعذّر إعادة التفعيل"
